<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Üretim Raporu</title>
  <!-- html2pdf.js Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.2;
      color: #333;
      margin: 0;
      padding: 10px;
      background-color: #fff;
    }
    .rapor-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
    }
    .foto-kart { 
      width: 100%; 
      max-width: 100%;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      margin-bottom: 15px;
      text-align: center; 
      position: relative; 
      background: #ffffff;
      padding: 5px;
    }
    .foto-kart img { 
      max-width: 100% !important;
      width: auto !important;
      max-height: 110mm !important;
      height: auto !important;
      object-fit: contain;
      display: inline-block;
      margin: 0 auto;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
    .buton-grup {
      text-align: center;
      margin: 20px 0;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 5px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    @media print {
      .buton-grup {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="buton-grup">
    <button class="btn" onclick="pdfIndir()">PDF İndir</button>
    <button class="btn" onclick="pdfPaylas()">PDF Paylaş</button>
  </div>

  <div id="pdf-icerik" class="rapor-container">
    <!-- Örnek Fotoğraf Kartları -->
    <div class="foto-kart">
      <img src="34453.jpg" alt="Üretim Ekranı 1">
    </div>
    <div class="foto-kart">
      <img src="34455.jpg" alt="Üretim Ekranı 2">
    </div>
  </div>

  <script>
    function pdfAyarlari() {
      return {
        margin: [5, 5, 5, 5],
        filename: 'uretim_proses_raporu.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 1.5, useCORS: true, letterRendering: true, windowWidth: 800 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', putOnlyUsedFonts: true }
      };
    }

    function pdfIndir() {
      const element = document.getElementById('pdf-icerik');
      html2pdf().from(element).set(pdfAyarlari()).save();
    }

    async function pdfPaylas() {
      const element = document.getElementById('pdf-icerik');
      try {
        const worker = html2pdf().from(element).set(pdfAyarlari());
        const pdfBlob = await worker.outputPdf('blob');
        const file = new File([pdfBlob], 'uretim_proses_raporu.pdf', { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'Üretim Proses Raporu',
            text: 'Güncel üretim ekranı raporu ektedir.',
            files: [file]
          });
        } else {
          alert('Tarayıcınız dosya paylaşımını desteklemiyor. Lütfen PDF İndir seçeneğini kullanın.');
        }
      } catch (error) {
        console.error('Paylaşım hatası:', error);
      }
    }
  </script>

</body>
</html>
